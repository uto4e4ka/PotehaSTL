<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 12px; width: 220px; font: 13px/1.4 system-ui, sans-serif; background: #1b1b1d; color: #eee; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  button { display: block; width: 100%; margin: 0 0 8px; padding: 9px 10px; border: 0; border-radius: 6px;
           font: inherit; text-align: left; cursor: pointer; background: #2c2c30; color: #eee; }
  button:hover { background: #3a3a40; }
  button b { display: block; }
  button span { color: #9a9aa2; font-size: 12px; }
  #status { color: #9a9aa2; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
  <h1>Экспорт сцены three.js</h1>
  <button data-format="glb"><b>GLB</b><span>геометрия, UV, текстуры, материалы</span></button>
  <button data-format="stl"><b>STL</b><span>только геометрия, для печати</span></button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
